<!-- description list is  a list of item with in their descriptions -->
<!-- contain dt and dd elements  dt means description term and dd means description definition -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description List</title>
</head>

<body>
    <dl>
        <dt>HTML</dt>
        <dd>HTML is a markup language that is used to create web pages and web applications.</dd>

        <dt>CSS</dt>
        <dd>CSS is a style sheet language that is used to describe the presentation of a document written in HTML.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript is a programming language that is used to create dynamic and interactive web pages.</dd>
    </dl>
</body>

</html>
