<!-- ordered list is a lists are with in order or sequence -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List</title>
</head>
<body>
    <h3>how to make coffee </h3>
    <ol>
        <li>measure the coffee beans</li>
        <li>grind the coffee beans</li>
        <li>boil the water</li>
        <li>pour the water over the coffee grounds</li>
        <li>let the coffee brew for a few minutes</li>
        <li>pour the coffee into a cup</li>
        <li>add milk and sugar if desired</li>
        <li>enjoy your coffee!</li>
    </ol>
</body>
</html>
