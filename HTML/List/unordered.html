<!-- unordered list is a list of items that are not in any particular order -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <h3>ingredients for coffee</h3>
    <ul>
        <li>coffee beans</li>
        <li>water</li>
        <li>milk</li>
        <li>sugar</li>
    </ul>
</body>
</html>
