<!-- iframe is used to display another webpage or content within the current page -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
 </head>
 <body>
    <h1>Iframe Example</h1>
    <iframe src="https://www.youtube.com/embed/AubJaosfI-0?si=kXRQDqveyI8q-Gkj" width="600" height="400" title="Example Iframe"></iframe>
    <p>This is an example of an iframe that displays content from another webpage.</p>
 </body>
 </html>
