<!-- in html to add media elements like images, audio, and video using the <img>, <audio>, and <video> tags -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Media Elements</title>
    </head>
    <body>
        <h3>Media Elements</h3>
        <p>In HTML, media elements like images, audio, and video can be added using the <code>&lt;img&gt;</code>, <code>&lt;audio&gt;</code>, and <code>&lt;video&gt;</code> tags.</p>
        <h4>Image</h4>
        <img src="/images/images.jpg" alt="Description of the image" width="300">
        <h4>Audio</h4>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <h4>Video</h4>
        <video width="320" height="240" controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </body>
    </html>
