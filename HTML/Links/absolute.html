<!-- absolute links are links that point to a specific location on the web, using the full URL  that contain the protocol (e.g., http:// or https://) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Links</title>
</head>
<body>
    <h3>Absolute Links</h3>
    <p>Absolute links are links that point to a specific location on the web, using the full URL that contain the protocol (e.g., http:// or https://).</p>
    <a href="https://www.google.com" target="_self">Google</a>
    <a href="https://www.youtube.com" target="_self">YouTube</a>
</body>
</html>
