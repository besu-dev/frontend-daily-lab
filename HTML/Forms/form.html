<!-- HTML Input Basics -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
 </head>
 <body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="besufikad"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <input type="submit" value="Submit">

        <!-- type attribute is  used to specify and create input text fields -->
         <!-- name attribute is used to identify input data when the form is submitted -->
          <!-- value attribute is used to set initial value of the input field -->
           <!-- id attribute is used to uniquely identify the input field -->
    </form>
 </body>
 </html>
